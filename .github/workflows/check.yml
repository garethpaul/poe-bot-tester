name: Check
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 24]
    env:
      POE_API_KEY: ""
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # Out-of-band observers. These invoke the checkers DIRECTLY so that their exit
      # status reaches the job even if a Makefile recipe swallows it (e.g. `|| true`).
      # A checker that only ever runs inside `make check` cannot report a neutered
      # `make check`, because it is downstream of the recipe it is meant to police.
      # Keep these as separate steps; do not fold them into `make check`.
      - run: scripts/check-baseline.sh
      - run: node scripts/test-makefile-root.mjs
      - run: make check
